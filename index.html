<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>車證查詢系統</title>

<style>

body{
    font-family: Microsoft JhengHei;
    background:#f5f7fb;
    padding:40px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#333;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:30px;
}

input{
    flex:1;
    padding:12px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:10px;
}

button{
    padding:12px 20px;
    background:#4a90e2;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#357bd8;
}

.card{
    background:#f9fafc;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    border-left:5px solid #4a90e2;
}

.row{
    margin:8px 0;
}

.label{
    font-weight:bold;
    color:#555;
}

</style>
</head>

<body>

<div class="container">

<h1>車證查詢系統</h1>

<div class="search-box">
    <input type="text" id="keyword" placeholder="輸入學號或車號">
    <button onclick="searchData()">查詢</button>
</div>

<div id="result"></div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyiWfRMU1D-oJ0729_3rC0wkRVsbpc_6AMEeBnYbfFJpLB_zl5Hmnjq2pMr5I0CwcLFcw/exec";

async function searchData(){

    const keyword = document.getElementById("keyword").value.trim();

    if(!keyword){
        alert("請輸入學號或車號");
        return;
    }

    const response = await fetch(`${API_URL}?keyword=${keyword}`);

    const data = await response.json();

    const resultDiv = document.getElementById("result");

    resultDiv.innerHTML = "";

    if(data.length === 0){
        resultDiv.innerHTML = "<p>查無資料</p>";
        return;
    }

    data.forEach(item => {

        resultDiv.innerHTML += `
        <div class="card">

            <div class="row"><span class="label">姓名：</span>${item.姓名}</div>

            <div class="row"><span class="label">學號：</span>${item.學號}</div>

            <div class="row"><span class="label">車號：</span>${item.車號}</div>

            <div class="row"><span class="label">學年：</span>${item.學年}</div>

            <div class="row"><span class="label">學期：</span>${item.學期}</div>

            <div class="row"><span class="label">連絡電話：</span>${item.連絡電話}</div>

            <div class="row"><span class="label">手機：</span>${item.手機}</div>

            <div class="row"><span class="label">在學狀態：</span>${item.在學狀態}</div>

            <div class="row"><span class="label">狀態：</span>${item.狀態}</div>

        </div>
        `;
    });
}

document.getElementById("keyword")
.addEventListener("keypress",function(e){
    if(e.key==="Enter"){
        searchData();
    }
});

</script>

</body>
</html>
