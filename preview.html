<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車證查詢系統</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    background:white;
    padding:30px;
    border-radius:15px;
    width:350px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}
input,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}
button{
    background:#4a90e2;
    color:white;
    border:none;
    cursor:pointer;
}
button:hover{
    background:#357bd8;
}
.result{
    margin-top:20px;
    background:#f8f8f8;
    padding:15px;
    border-radius:10px;
    white-space:pre-wrap;
}
</style>
</head>
<body>

<div class="box">
    <h2>車證查詢</h2>

    <input type="password" id="pwd">
    <input type="text" id="keyword">

    <button onclick="searchData()">查詢</button>

    <div class="result" id="result"></div>
</div>

<script>

// Google Apps Script Web App URL
const apiUrl = "https://script.google.com/macros/s/AKfycbx8Ta-ZtQKjf4WqU9p4C5LzFrjp-8EBcWurYVq_J7Gtqnw2CEqCYFi2XzOc_PZwiUrCxg/exec";

async function searchData(){

    const pwd = document.getElementById("pwd").value.trim();
    const keyword = document.getElementById("keyword").value.trim().toLowerCase();

    const resultDiv = document.getElementById("result");

    if(pwd !== "000" && pwd !== "999"){
        resultDiv.innerText = "密碼錯誤";
        return;
    }

    try{

        const response = await fetch(apiUrl);
        const data = await response.json();

        const found = data.filter(item => {

            const car = (item.車號 || "").toLowerCase();
            const sid = (item.學號 || "").toLowerCase();

            return car.includes(keyword) || sid.includes(keyword);

        });

        if(found.length === 0){
            resultDiv.innerText = "查無資料";
            return;
        }

        let html = "";

        found.forEach(item => {

            if(pwd === "000"){

                html += `
車號：${item.車號 || ""}
學號：${item.學號 || ""}
狀態：${item.狀態 || ""}
------------------------
`;

            }else{

                for(let key in item){
                    html += `${key}：${item[key]}\n`;
                }

                html += "------------------------\n";
            }

        });

        resultDiv.innerText = html;

    }catch(e){

        resultDiv.innerText = "資料讀取失敗";

    }

}
</script>

</body>
</html>
